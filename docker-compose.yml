services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: haihand-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=4000
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    networks:
      - haihand-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: haihand-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - REACT_APP_API_URL=http://localhost:4000
      - WDS_SOCKET_PORT=0
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - haihand-network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: haihand-admin
    restart: unless-stopped
    ports:
      - "4001:4001"
    env_file:
      - ./admin/.env
    environment:
      - PORT=4001
      - HOST=0.0.0.0
      - WDS_SOCKET_PORT=0
      - NODE_ENV=development
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - haihand-network

networks:
  haihand-network:
    driver: bridge
