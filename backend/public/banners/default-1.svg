    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg1)"/>
  <circle cx="670" cy="110" r="170" fill="#FACC15" opacity="0.12"/>
  <circle cx="120" cy="510" r="200" fill="#38BDF8" opacity="0.10"/>

